rubrics:
  - id: 1
    type: f2p
    text: 重用保护开启时，同一用户同一时间步的并发提交只有一个请求获得可用二因素会话。
  - id: 2
    type: f2p
    text: 竞争失败的请求被稳定判定为验证码重放，不会泄露唯一约束或泛化存储错误。
  - id: 3
    type: f2p
    text: 会话重建或保存失败后，不会留下永久消耗验证码但没有可用二因素会话的状态，并具有确定的重试恢复结果。
  - id: 4
    type: f2p
    text: TOTP last_used_at、认证成功或失败日志、重放状态和会话终态不会互相矛盾。
  - id: 5
    type: p2p
    text: disable_reuse_security_policy 开启时继续允许同一时间步重用，并保持现有告警与认证语义。
  - id: 6
    type: p2p
    text: 无效验证码、不同时间步、正常单请求登录以及 TOTP 注册写入历史的既有行为不回归。

